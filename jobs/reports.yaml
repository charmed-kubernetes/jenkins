# Reporting jobs

- job:
    name: 'generate-reports-overview'
    node: 'amd64 && large'
    description: |
      generates a report overview
    project-type: freestyle
    scm:
      - k8s-jenkins-jenkaas
    properties:
      - build-discarder:
          num-to-keep: 10
    triggers:
        - timed: "@hourly"
    wrappers:
      - default-job-wrapper
      - ci-creds
    builders:
      - set-env
      - run-venv:
          COMMAND: |
            # read the bound aws_creds file directly rather than relying on
            # ~/.aws/credentials having been provisioned on the agent
            export AWS_SHARED_CREDENTIALS_FILE="$AWSCREDS"
            python bin/report build
