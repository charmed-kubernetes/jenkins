# Mirrors container images needed by Charmed Kubernetes to ghcr.io/canonical/cdk.

- job:
    name: 'sync-oci-images'
    node: 'amd64 && large'
    description: |
      Mirrors container images needed by Charmed Kubernetes to ghcr.io/canonical/cdk.
    project-type: pipeline
    pipeline-scm:
      scm:
        - k8s-jenkins-jenkaas
      script-path: jobs/sync-oci-images/sync-oci-images.groovy
    parameters:
      - string:
          name: build_node
          default: 'amd64 && large'
      - string:
          name: versions
          default: '1.33 1.34 1.35 1.36'
          description: |
            Space-separated CK versions. For each, this job clones the cdk-addons
            release-`version` branch if one exists (otherwise the default branch),
            records the upstream images of the latest K8s patch release in the bundle
            image list, and mirrors the version's images.
      - bool:
          name: dry_run
          default: false
          description: only report what would be pushed to github / ghcr.io.
    properties:
      - build-discarder:
          num-to-keep: 10
    triggers:
        - timed: "@daily"
